name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Qt test runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            qt6-declarative-dev-tools \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qttest
      - name: Run tests
        run: ./tests/run
